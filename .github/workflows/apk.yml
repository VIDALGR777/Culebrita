name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias y crear los iconos
        run: |
          npm install --no-audit --no-fund
          node tools/icons.js www

      - name: Crear el proyecto de Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Poner el icono de Culebra
        run: |
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            dir=android/app/src/main/res/mipmap-$d
            cp www/icon-maskable-512.png "$dir/ic_launcher.png"
            cp www/icon-maskable-512.png "$dir/ic_launcher_round.png"
            rm -f "$dir/ic_launcher_foreground.png"
          done
          rm -rf android/app/src/main/res/mipmap-anydpi-v26

      - name: Compilar
        working-directory: android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          ./gradlew assembleDebug --no-daemon

      - name: Publicar el APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk culebra.apk
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk culebra.apk \
            --target "${{ github.sha }}" \
            --title "Culebra (APK)" \
            --notes "APK de Culebra compilado automáticamente. Descárgalo e instálalo en tu Android."
